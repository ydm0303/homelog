# ============================================================================
# 生产环境完整配置
# ============================================================================

server:
  port: 10000
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  mvc:
    static-path-pattern: /static/**

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    druid:
      initial-size: 8
      min-idle: 5
      max-active: 30
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000

  jpa:
    database: mysql
    show-sql: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
        use_sql_comments: false
        jdbc:
          lob:
            non_contextual_creation: true

  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:prod@company.com}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          starttls:
            enable: false
            required: false

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    # 关闭打印日志
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      field-strategy: not_empty
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.homelog.entity

homelog:
  jwt:
    secret: ${JWT_SECRET:HomelogProdJWTSecretKey2026!MustBeLongEnoughForHS256}
    access-token-expire: 900000
    refresh-token-expire: 604800000
    token-header: Authorization
    token-prefix: "Bearer "

  remind:
    lead-days: "7,1,0"
    from: ${MAIL_USERNAME:prod@company.com}
    cron: "0 0 8 * * ?"

  storage:
    type: local
    local:
      base-path: /opt/homelog/uploads
      base-url: /api/files
    oss:
      endpoint: ${OSS_ENDPOINT:}
      access-key: ${OSS_ACCESS_KEY:}
      secret-key: ${OSS_SECRET_KEY:}
      bucket: ${OSS_BUCKET:}
      domain: ${OSS_DOMAIN:}

  frontend:
    base-url: ${FRONTEND_BASE_URL:https://your-domain.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: true

logging:
  level:
    com.homelog: info
    org.springframework.security: info
    org.hibernate.SQL: info
    org.hibernate.type.descriptor.sql.BasicBinder: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/homelog-prod.log
    max-size: 200MB
    max-history: 30