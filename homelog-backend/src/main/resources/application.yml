# ============================================================================
# 家记 - 后端配置文件 (Spring Boot 2.7 + Java 8)
# ============================================================================

# 服务端口
# 注意：不要设置 context-path。所有 Controller 已自带 /api 前缀，
# 前端 baseURL 也是 /api，再加 context-path 会导致 /api/api/... 双重前缀 404。
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

# Spring 配置
spring:
  # 环境配置
  profiles:
    active: dev

  # 本地私有配置（数据库口令、邮件授权码等），已被 .gitignore 忽略，不入库
  # 优先级：application-local.yml > application-dev.yml > application.yml
  # 文件不存在时自动跳过（optional），因此全新克隆也能启动，只需用环境变量提供口令
  config:
    import:
      - "optional:classpath:application-local.yml"
      - "optional:file:./application-local.yml"

  # 文件上传路径映射
  mvc:
    static-path-pattern: /static/**

  # 数据源配置 (Druid + MySQL 8.0)
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接信息全部走环境变量，不硬编码口令；本地开发可写入 application-local.yml 覆盖
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:homelog}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000

  # JPA / Hibernate 配置
  jpa:
    database: mysql
    show-sql: false
    hibernate:
      ddl-auto: none  # 生产环境用 Flyway 管理，开发可改为 update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          lob:
            non_contextual_creation: true

  # 邮件配置 (QQ 邮箱 SMTP SSL 465)
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:your-qq@qq.com}
    password: ${MAIL_PASSWORD:your-16-char-auth-code}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          starttls:
            enable: false
            required: false

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  # Servlet 配置 (文件上传)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
      enabled: true

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      field-strategy: not_empty
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.homelog.entity

# 业务自定义配置
homelog:
  # JWT 配置
  jwt:
    secret: ${JWT_SECRET:homelog-family-record-secret-key-2024-change-in-production}
    access-token-expire: 900000      # 15 分钟 (毫秒)
    refresh-token-expire: 604800000  # 7 天 (毫秒)
    token-header: Authorization
    token-prefix: "Bearer "

  # 提醒配置
  remind:
    lead-days: "7,1,0"     # 提前 7天/1天/当天 各提醒一次
    from: ${MAIL_USERNAME:your-qq@qq.com}
    cron: "0 0 8 * * ?"    # 每天 08:00 扫描

  # 文件存储配置
  storage:
    type: local  # local / oss
    local:
      base-path: ./uploads
      base-url: /api/files
    oss:
      endpoint: ${OSS_ENDPOINT:}
      access-key: ${OSS_ACCESS_KEY:}
      secret-key: ${OSS_SECRET_KEY:}
      bucket: ${OSS_BUCKET:}
      domain: ${OSS_DOMAIN:}

  # PWA 前端地址 (用于邮件跳转链接)
  frontend:
    base-url: http://localhost:5173


# Actuator 监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# 日志配置
logging:
  level:
    com.homelog: debug
    org.springframework.security: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/homelog.log
    max-size: 100MB
    max-history: 30