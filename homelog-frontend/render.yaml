services:
  - type: static
    name: homelog-frontend
    buildCommand: pnpm install && pnpm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    # 路由（Vue history模式必备，兜底到index.html）
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # index.html 不缓存
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # 打包带hash的静态资源，长期缓存
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable