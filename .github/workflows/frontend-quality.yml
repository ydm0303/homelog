name: Frontend Quality

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    name: Type-check and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./homelog-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: homelog-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: ESLint and style guard
        run: npm run lint
