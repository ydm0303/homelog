name: Frontend Quality

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    name: Type-check and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./homelog-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 版本由 homelog-frontend/package.json 的 packageManager 字段决定；
      # 该步骤必须在 setup-node 之前，否则 cache: pnpm 找不到 pnpm 无法定位 store
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 仓库根没有 package.json，需显式指向前端，否则读不到 packageManager 字段
          package_json_file: homelog-frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: homelog-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run type-check

      - name: Unit tests
        run: pnpm test

      - name: ESLint and style guard
        run: pnpm run lint
